name: PaperLogin
version: '${version}'
main: dev.tn3w.paperlogin.PaperLogin
api-version: '1.21'
description: Log in to a website with your Minecraft account
authors: [TN3W]
libraries:
  - redis.clients:jedis:5.2.0
commands:
  login:
    description: Generate a login code for website login
    usage: /login
    permission: paperlogin.login
  verify:
    description: Verify login from website
    usage: /verify <code>
    permission: paperlogin.verify
permissions:
  paperlogin.login:
    description: Allows player to use login command
    default: true
  paperlogin.verify:
    description: Allows player to use verify command
    default: true
